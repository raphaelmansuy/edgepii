[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgepii"
version = "0.1.0"
description = "Locate PII as typed character spans on the source string."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "phonenumbers>=8.13",
  "pyyaml>=6",
]

[project.optional-dependencies]
hf = ["transformers>=4.46", "torch>=2.2"]
gliner2 = ["gliner2==2.1.0", "torch>=2.2"]
gliner = ["gliner>=0.2.16", "torch>=2.2"]
ms = ["modelscope>=1.20", "torch>=2.2"]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
e2e = ["pytest-playwright>=0.5", "playwright>=1.44"]
eval = ["pyarrow>=16"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgepii = ["taxonomies/*.yaml", "eval/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
