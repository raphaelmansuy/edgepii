<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="edgepii">
  <!--
    The maskable variant. A platform may crop this to a circle, a squircle, or a
    rounded square, and it keeps the outer 20 percent as a bleed. So the tile
    fills the whole canvas with no corner radius, and the ink shrinks into the
    safe circle that is 40 percent of the width from the centre.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa6ff"/>
      <stop offset="0.55" stop-color="#4f86ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#tile)"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <path d="M24 15 H15 V49 H24" fill="none" stroke="#04070f" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 15 H49 V49 H40" fill="none" stroke="#04070f" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
