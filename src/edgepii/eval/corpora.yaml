    sha256: bb1337d1b289e3da63accc032d614330313fd700612792094a482266fcc389d9
    license: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/legalcode
    citation: https://aclanthology.org/2025.naacl-srw.23/
    text_column: text
    spans_column: ent_tags
    spans_encoding: bio
    id_column: null
    group_columns: []
    slices:
      legal: {}
    labels:
      NAME: PERSON
      EMAIL: EMAIL
      PHONE_NUM: PHONE
      ADDRESS: ADDRESS
      USERNAME: USERNAME
      ID_NUM: GOV_ID
    drop:
      - labels: [URL]
        reason: A web address is a trace identifier outside taxonomy 2026.11, and it is the same decision the Nemotron map records for url.
