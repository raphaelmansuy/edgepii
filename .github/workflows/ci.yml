name: ci

# The claims on the PyPI page and the site are only worth what CI enforces.
# This job runs the contract tests on every supported Python, builds the exact
# artifacts that ship, and then installs the built wheel into a clean
# environment to prove it works the way a user will find it.
#
# Nothing here calls a model hub. The rules lane needs no weights, so the whole
# matrix runs offline and in a couple of minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: test
        run: python -m pytest tests -q

  package:
    name: build and install the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: build
        run: python -m build

      - name: check the metadata
        run: twine check dist/*

      - name: install the built wheel, then run it
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          # The console entry point and the public API must both work from the
          # artifact, not just from the source tree.
          /tmp/wheel-test/bin/python - <<'PY'
          import sys
          import edgepii
          from edgepii import Locator, redact, restore

          assert edgepii.__version__, "no __version__"
          prompt = "Card 4242424242424242 and email ada@example.com."
          spans = Locator.preset("rules").locate(prompt).spans
          masked, vault = redact(prompt, spans)
          assert "4242424242424242" not in masked, masked
          assert all(prompt[s.start:s.end] == s.text for s in spans)

          answer = restore("Sent to <email_1> about <PAYMENT_1>.", vault)
          assert answer.ok, answer.to_dict()
          assert "ada@example.com" in answer.text

          assert "torch" not in sys.modules, "the rules lane must not import torch"
          print("wheel ok", edgepii.__version__)
          PY

      - name: install the sdist, which must compile from source
        run: |
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/pip install dist/*.tar.gz
          /tmp/sdist-test/bin/python -c "import edgepii; print('sdist ok', edgepii.__version__)"

      - name: keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke the published shape
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: every documented example must still run
        run: |
          python -m venv /tmp/docs-test
          /tmp/docs-test/bin/pip install dist/*.whl
          /tmp/docs-test/bin/python examples/run_local.py
