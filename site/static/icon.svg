<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="edgepii">
  <!--
    The mark is a span: a pair of bracket arms that enclose a range of text.
    It says what the library returns, a character range on your string, and it
    is not a shield, a lock, or a magnifier, because those say "security" in
    general and say nothing about offsets.

    Geometry is on a 64 unit grid. The ink sits inside 10.5 to 53.5 on both
    axes, so it is optically centred and survives a maskable icon crop that
    clips the outer 20 percent. Stroke is 9 units with round caps, which is
    thick enough to hold a hard edge at 16 pixels and thin enough to keep the
    counter open at 512.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa6ff"/>
      <stop offset="0.55" stop-color="#4f86ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <path d="M24 15 H15 V49 H24" fill="none" stroke="#04070f" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 15 H49 V49 H40" fill="none" stroke="#04070f" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
