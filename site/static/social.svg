<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="edgepii: typed character spans on the exact source string">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d" />
      <stop offset="1" stop-color="#0a1020" />
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <rect x="80" y="86" width="72" height="72" rx="20" fill="url(#mark)" />
  <text x="116" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700"
        text-anchor="middle" fill="#04070f">e&#183;p</text>
  <text x="176" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700"
        fill="#e8edf7" letter-spacing="-1">edgepii</text>

  <text x="80" y="252" font-family="Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700"
        fill="#ffffff" letter-spacing="-1.6">Know exactly which</text>
  <text x="80" y="318" font-family="Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700"
        fill="#ffffff" letter-spacing="-1.6">characters are personal data.</text>

  <text x="80" y="378" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25"
        fill="#93a1bb">Typed character spans on the exact source string.</text>
  <text x="80" y="414" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25"
        fill="#93a1bb">Every row proves source[start:end] == text.</text>

  <g font-family="Menlo, monospace" font-size="24">
    <text x="80" y="500" fill="#e8edf7">Email </text>
    <rect x="146" y="478" width="252" height="34" rx="6" fill="#35e0b6" fill-opacity="0.2" />
    <text x="156" y="500" fill="#35e0b6">ada@example.com</text>
    <text x="398" y="500" fill="#e8edf7"> card </text>
    <rect x="474" y="478" width="286" height="34" rx="6" fill="#b98cff" fill-opacity="0.22" />
    <text x="484" y="500" fill="#b98cff">4242424242424242</text>
  </g>
  <text x="80" y="558" font-family="Menlo, monospace" font-size="20" fill="#64718a">
    EMAIL 0:15  &#183;  PAYMENT 21:37  &#183;  slice check ok
  </text>
</svg>
