[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgepii"
dynamic = ["version"]
description = "Locate PII as typed character spans on the source string, so you can mask it before it reaches an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Raphael Mansuy" }]
keywords = ["pii", "privacy", "redaction", "ner", "llm", "masking", "gdpr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "phonenumbers>=8.13",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://raphaelmansuy.github.io/edgepii/"
Repository = "https://github.com/raphaelmansuy/edgepii"
Documentation = "https://raphaelmansuy.github.io/edgepii/"
Issues = "https://github.com/raphaelmansuy/edgepii/issues"
Changelog = "https://github.com/raphaelmansuy/edgepii/blob/main/CHANGELOG.md"

[project.optional-dependencies]
hf = ["transformers>=5.22.1,<6", "torch>=2.6"]
gliner2 = ["gliner2[local]==2.1.0", "torch>=2.2"]
gliner = ["gliner>=0.2.16", "torch>=2.2"]
ms = ["modelscope>=1.20", "torch>=2.2"]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
e2e = ["pytest-playwright>=0.5", "playwright>=1.44"]
eval = ["pyarrow>=16", "faker>=30"]
modal = ["modal==1.4.2"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[tool.setuptools.dynamic]
version = { attr = "edgepii._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgepii = ["taxonomies/*.yaml", "eval/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
