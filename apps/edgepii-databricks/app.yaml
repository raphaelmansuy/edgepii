command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: EDGEPII_MODELS
    value: "databricks-gpt-oss-20b,databricks-qwen3-next-80b-a3b-instruct,databricks-meta-llama-3-3-70b-instruct,databricks-gemma-3-12b"
  - name: PYTHONUNBUFFERED
    value: "1"
